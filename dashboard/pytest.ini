[pytest]
# A6: unit-test layer alongside the executable probes. Probes exercise the live
# stack end-to-end (server, real DB, real artifacts) and are run on every deploy.
# Pytest covers fast, in-memory units: renderers, label coverage, pure helpers.
# Sub-second feedback for schema and renderer changes M2.5 will need.
#
# Run from the dashboard/ directory: `pytest backend/tests/` (the rootdir
# convention keeps both probes and tests discoverable but separate).
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Quiet mode by default; -v on CI shows each test name.
addopts = -ra --strict-markers
# Mark long-running or server-tier tests so the fast subset can be selected.
markers =
    server: requires server-tier deps (markdown-it-py) — skipped on laptop without them
