# The ranges file of generator v2 (DECISIONS #440 item 7, #441): one table per range.
# A range is from, to and step, or a list of values, and one non-empty line "why" saying where it comes from.
# A theory takes its numbers from here by key, and may narrow a range, never widen it.
# The hard limits of each indicator live in research_lab/indicators/limits.py, not here.

