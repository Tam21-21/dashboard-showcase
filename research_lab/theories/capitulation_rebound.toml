# Worked example 1: the capitulation rebound, the test theory of DECISIONS #440 item 2.
# The idea in one line: a close below the lower Bollinger band, on a volume spike, with RSI low, is followed
# by a rebound towards the price before the drop. Every number is a letter taken from ranges.toml.

[theory]
name = "capitulation_rebound"
display_name = "Capitulation rebound"
bar = "1d"
side = "long"
entry_time = "next_open"
status = "test"

[operand.close]
kind = "field"
field = "close"

[operand.lower]
kind = "indicator"
indicator = "bollinger"
params = { n = "N", w = "W" }
output = "lower"

[operand.vol]
kind = "indicator"
indicator = "volume_ratio"
params = { n = "N" }

[operand.rsi]
kind = "indicator"
indicator = "rsi"
params = { n = "R" }

# The price before the drop: the close 3 bars back. The exit calibration aims at it.
[operand.pre_drop]
kind = "field"
field = "close"
offset = 3

[[entry.group]]
conditions = [
  { left = "close", op = "<", right = "lower" },
  { left = "vol", op = ">=", right = "k" },
  { left = "rsi", op = "<", right = "L" },
]

# No exit group: the way out is the calibrated stop and target, or max_hold bars.
[exit]
stop = "calibrated"
target = "calibrated"
max_hold = "H"
expected_price = "pre_drop"

[stocks]
group = "volatile"

[risk]
method = "volatility_stop"

[money]
method = "equal_slots"

[parameter_picks.N]
range = "rebound_bb_window"

[parameter_picks.W]
range = "rebound_bb_width"

[parameter_picks.k]
range = "rebound_volume_ratio"

[parameter_picks.R]
range = "rebound_rsi_window"

[parameter_picks.L]
range = "rebound_rsi_line"

[parameter_picks.H]
range = "rebound_max_hold"

# The search settings (DECISIONS #470): the starter values. Round 1 uses about 20 values per number, a round of 500 strategies, narrows
# around the best 5, goes up to 5 rounds, runs every combination of a box below 5000, and keeps 3 finalists.
[search]
values_per_number = 20
round_size = 500
best = 5
max_rounds = 5
all_below = 5000
keep = 3
