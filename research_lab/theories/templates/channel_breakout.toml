# Template 4 of 4 (Tamer, 2026-10-17): a channel breakout. No slot, so it makes one theory, named and worded as
# the template. Entry when the close crosses above the highest high of the last BE bars; the way out is a
# close below the lowest low of the last BX bars. The library reads only the bars before today.

[theory]
name = "channel_breakout"
display_name = "Channel breakout"
kind = "template"
bar = "1d"
side = "long"
entry_time = "next_open"
status = "research"

[operand.close]
kind = "field"
field = "close"

[operand.upper]
kind = "indicator"
indicator = "donchian"
params = { n = "BE" }
output = "upper"

[operand.exit_low]
kind = "indicator"
indicator = "donchian"
params = { n = "BX" }
output = "lower"

[[entry.group]]
conditions = [
  { left = "close", op = "crosses_above", right = "upper" },
]

[[exit.group]]
conditions = [
  { left = "close", op = "<", right = "exit_low" },
]

[stocks]
group = "trending"

[risk]
method = "volatility_stop"

[money]
method = "equal_slots"

[parameter_picks.BE]
range = "breakout_entry_window"

[parameter_picks.BX]
range = "breakout_exit_window"

# The search settings (DECISIONS #470): the starter values. Round 1 uses about 20 values per number, a round of 500 strategies, narrows
# around the best 5, goes up to 5 rounds, runs every combination of a box below 5000, and keeps 3 finalists.
[search]
values_per_number = 20
round_size = 500
best = 5
max_rounds = 5
all_below = 5000
keep = 3
