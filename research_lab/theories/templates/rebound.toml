# Template 1 of 4 (Tamer, 2026-10-17): a rebound after a crash. A close below a low line, on a volume spike,
# with an oscillator low, is followed by a rebound. Two slots of two choices each make four theories.
# The Bollinger lower band with RSI is the capitulation_rebound theory with a stop and a target of its own.

[theory]
name = "rebound"
display_name = "Rebound after a crash"
kind = "template"
bar = "1d"
side = "long"
entry_time = "next_open"
status = "research"

[operand.close]
kind = "field"
field = "close"

[operand.vol]
kind = "indicator"
indicator = "volume_ratio"
params = { n = "N" }

# The low line the close must fall below.
[slot.low_line]
choices = ["bollinger_lower", "donchian_low"]

# The oscillator that must be low, and the line it must be under.
[slot.oscillator]
choices = ["rsi", "stochastic"]

[choice.bollinger_lower]
words = "Bollinger lower band"

[choice.bollinger_lower.operand.lower]
kind = "indicator"
indicator = "bollinger"
params = { n = "N", w = "W" }
output = "lower"

# No offset: the library reads only the bars before today.
[choice.donchian_low]
words = "Donchian low"

[choice.donchian_low.operand.lower]
kind = "indicator"
indicator = "donchian"
params = { n = "N" }
output = "lower"

[choice.rsi]
words = "RSI"

[choice.rsi.operand.osc]
kind = "indicator"
indicator = "rsi"
params = { n = "R" }

[choice.rsi.operand.osc_line]
kind = "constant"
value = "L"

[choice.stochastic]
words = "Stochastic"

[choice.stochastic.operand.osc]
kind = "indicator"
indicator = "stochastic"
params = { k = "SK", d = 3 }
output = "k"

[choice.stochastic.operand.osc_line]
kind = "constant"
value = "SL"

[[entry.group]]
conditions = [
  { left = "close", op = "<", right = "lower" },
  { left = "vol", op = ">=", right = "k" },
  { left = "osc", op = "<", right = "osc_line" },
]

[exit]
stop = "ST"
target = "TG"
max_hold = "H"

[stocks]
group = "volatile"

[risk]
method = "volatility_stop"

[money]
method = "equal_slots"

[parameter_picks.N]
range = "rebound_bb_window"

[parameter_picks.W]
range = "rebound_bb_width"

[parameter_picks.k]
range = "rebound_volume_ratio"

[parameter_picks.R]
range = "rebound_rsi_window"

[parameter_picks.L]
range = "rebound_rsi_line"

[parameter_picks.SK]
range = "swing_stoch_window"

[parameter_picks.SL]
range = "rebound_stoch_line"

[parameter_picks.ST]
range = "swing_stop"

[parameter_picks.TG]
range = "swing_target"

[parameter_picks.H]
range = "rebound_max_hold"

# The search settings (DECISIONS #470): the starter values. Round 1 uses about 20 values per number, a round of 500 strategies, narrows
# around the best 5, goes up to 5 rounds, runs every combination of a box below 5000, and keeps 3 finalists.
[search]
values_per_number = 20
round_size = 500
best = 5
max_rounds = 5
all_below = 5000
keep = 3
